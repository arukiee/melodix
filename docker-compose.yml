services:
  minio:
    image: minio/minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: melodix
      MINIO_ROOT_PASSWORD: melodix_dev_password
    command: server /data --console-address ":9001"
    volumes: ["minio_data:/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////app/test.db
      SECRET_KEY: melodix_super_secret_key_123!
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: melodix
      MINIO_ROOT_PASSWORD: melodix_dev_password
      MINIO_BUCKET: melodix
      MINIO_SECURE: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on: [minio, redis]
    volumes: ["./backend:/app"]

  celery-worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: sqlite:////app/test.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: melodix
      MINIO_ROOT_PASSWORD: melodix_dev_password
      MINIO_BUCKET: melodix
      MINIO_SECURE: "false"
    depends_on: [redis, minio]
    volumes: ["./backend:/app"]

volumes:
  minio_data:
