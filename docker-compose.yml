version: "3.8"

services:
  backend:
    build: ./backend
    container_name: melodix_backend
    ports:
      - "8000:8000"
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: melodix_postgres
    environment:
      POSTGRES_USER: melodix
      POSTGRES_PASSWORD: melodix_password
      POSTGRES_DB: melodix
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "melodix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
